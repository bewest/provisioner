openapi: 3.0.2
servers:
  - url: 'http://p0.internal.diabetes.watch'
info:
  description: >-
    Manage hosted databases and associated sites.
    You can learn more abou [provisioner](https://github.com/bewest/provisioner)
  version: 0.0.1
  title: Provisioner DB API
  termsOfService: 'http://swagger.io/terms/'
  contact:
    email: bewest@gmail.com
  license:
    name: BSD 3
tags:
  - name: account
    description: Environment for a process.
  - name: cluster
    description: Manages processes by cluster.
  - name: db
    description: Environment for a process.
  - name: env
    description: Environment for a process.
  - name: proc
    description: Access to proc managed by cluster.
  - name: site
    description: Environment for a process.
  - name: user
    description: Environment for a process.
paths:
  '/dbs':
    get:
      tags:
        - db
        - provisioner
      operationId: get_db_list
      summary: Get list of managed dbs.
      description: JSON description of all currently managed dbs.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseList'
        '400':
          description: Invalid status value
  '/dbs/{name}':
    get:
      tags:
        - db
        - provisioner
      operationId: get_named_db
      summary: Running database by name.
      description: Returns details of a database by `name`.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
        '400':
          description: Invalid ID supplied
        '404':
          description: Database not found
      deprecated: true
      parameters:
        - in: path
          description: "Name of managed database."
          required: true
          name: name
          schema:
            type: string
  '/about/stats':
    get:
      tags:
        - about
        - provisioner
        - search
      summary: Get tally of managed storage resources, accounts (dbs) and users (credentials).
      operationId: get_server_storage_tally
      description: >-
        Returns tally of all managed storage accounts and users.  This
        generally maps to the number of databases managed and user credentials
        provisioned for those databases.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/ServerManagedTally'
  '/about/search':
    get:
      tags:
        - about
        - provisioner
        - search
      summary: Search for users using tags
      operationId: get_searchable_props
      description: >-
        Searches user table by aggregate by tags and other properties.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPagination'
  '/accounts':
    get:
      tags:
        - account
      summary: Get list of accounts.
      operationId: get_accounts_list
      description: >-
        Returns description of all db accounts.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  $ref: '#/components/schemas/Account'
    post:
      tags:
        - account
        - provisioner
      summary: Create new managed database account.
      operationId: create_new_db_with_account
      description: >-
        Returns description of all db accounts.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreationInput'
        description: Environment to run defined process.
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
  '/accounts/{account}':
    get:
      tags:
        - account
      summary: Get accounts by account identifier.
      operationId: get_named_account
      description: >-
         Get one db accounts.
      parameters:
        - in: path
          name: account
          required: true
          description: "Account name"
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
    delete:
      tags:
        - account
      summary: Delete accounts by account identifier.
      description: >-
         Delete one db account.
      operationId: delete_named_account
      parameters:
        - in: path
          name: account
          description: "Account name"
          required: true
          schema:
            type: string
      responses:
        '204':
          description: successful operation
  '/accounts/{account}/dbs':
    parameters:
      - in: path
        name: account
        description: "Account name"
        required: true
        schema:
          type: string
    get:
      tags:
        - account
      summary: Get all dbs for accounts by account identifier.
      operationId: get_dbs_for_account
      description: >-
         Get all dbs associated with account.
      responses:
        '200':
          description: successful operation
  '/accounts/{account}/users':
    parameters:
      - in: path
        description: "Account ID. Must be valid mongo objectID"
        name: account
        required: true
        schema:
          type: string
    get:
      tags:
        - account
        - user
      summary: Get list of managed db users for associated account.
      operationId: get_users_for_account
      description: >-
         Get list of managed db users for associated account.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: integer
                    default: 1
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
    post:
      tags:
        - account
        - user
      summary: Create a new managed db users for associated account.
      operationId: create_user_for_account
      description: >-
         Create a new managed db user for associated account.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreationInput'
        description: Input to create credemtials for a DB.
        required: true
      responses:
        '200':
          description: successful operation
  '/accounts/{account}/users/{user}':
    parameters:
      - in: path
        description: "Account ID. Must be valid mongo objectID"
        name: account
        schema:
          type: string
        required: true
      - in: path
        description: "User ID. Must be valid mongo objectID"
        name: user
        schema:
          type: string
        required: true
    get:
      tags:
        - account
        - user
      summary: Get managed db user by id for associated account.
      operationId: get_user_for_account_by_id
      description: >-
         Get managed db user by id for associated account.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/User'

    delete:
      tags:
        - account
        - user
      summary: Delete managed db user by id for associated account.
      description: >-
         Delete managed db user by id for associated account.
      operationId: delete_user_for_account_by_id
      responses:
        '200':
          description: successful operation
    post:
      tags:
        - account
        - user
      summary: Update a managed db user by id for associated account.
      operationId: update_user_for_account_by_id
      description: >-
         Update a managed db user by id for associated account.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreationInput'
        description: Input to create credemtials for a DB.
        required: true
      responses:
        '200':
          description: successful operation
        '201':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/User'
  '/accounts/{account}/sites':
    parameters:
      - in: path
        description: "Account ID. Must be valid mongo objectID"
        name: account
        required: true
        schema:
          type: string
    get:
      tags:
        - account
        - site
      summary: Get list of managed sites for associated account.
      operationId: get_sites_for_account
      description: >-
         Get list of managed sites for associated account.
      responses:
        '200':
          description: successful operation
    post:
      tags:
        - account
        - site
      summary: Create a new managed site for associated account.
      description: >-
         Create a new managed site for associated account.
      operationId: create_sites_for_account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteCreationInput'
        description: Input to create credemtials for a DB.
        required: true
      responses:
        '200':
          description: successful operation
  '/accounts/{account}/sites/{site}':
    parameters:
      - in: path
        description: "Account ID. Must be valid mongo objectID"
        name: account
        schema:
          type: string
        required: true
      - in: path
        description: "Site Name."
        name: site
        schema:
          type: string
        required: true
    get:
      tags:
        - account
        - site
      summary: Get managed site by id for associated account.
      operationId: get_site_for_account_by_site_id
      description: >-
         Get managed site by id for associated account.
      responses:
        '200':
          description: successful operation
    delete:
      tags:
        - account
        - site
      summary: Delete managed site by id for associated account.
      description: >-
         Delete managed site by id for associated account.
      operationId: delete_site_for_account_by_site_id
      responses:
        '200':
          description: successful operation
    post:
      tags:
        - account
        - site
      summary: Update a managed site by id for associated account.
      operationId: update_site_for_account_by_site_id
      description: >-
         Update a managed site by id for associated account.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteCreationInput'
        description: Input to create credemtials for a DB.
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/Site'
  '/routes':
    get:
      tags:
        - routes
      responses:
        '200':
          description: An overview of routes.
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/MeshRouteTally'
  '/routes/search':
    get:
      tags:
        - routes
      responses:
        '200':
          description: Paginated search results for routes.
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/MeshedRoutePagination'
  '/routes/mesh':
    post:
      tags:
        - routes
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                account:
                  type: string
                backend:
                  type: string
                tags:
                  type: string
                  nullable: true
        description: Create a meshed route.
        required: true
      responses:
        '200':
          description: A created route.
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/MeshedRoute'
  '/routes/mesh/{account}':
    parameters:
      - in: path
        description: "Account ID. Must be valid mongo objectID"
        name: account
        schema:
          type: string
        required: true
    get:
      tags:
        - routes
      description: "Meshed route details."
      responses:
        '200':
          description: 'Route details.'
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/MeshedRoute'
    post:
      tags:
        - routes
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: string
                  nullable: true
        description: Create a meshed route.
        required: true
      responses:
        '201':
          description: 'Updated route with new tags if any.'
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/MeshedRoute'
    delete:
      tags:
        - routes
      responses:
        '204':
          description: 'Removed route'
  '/routes/mesh/{account}/reassign/{backend}':
    parameters:
      - in: path
        description: "Account ID. Must be valid mongo objectID"
        name: account
        schema:
          type: string
        required: true
      - in: path
        description: "Backend hostname:port address."
        name: backend
        schema:
          type: string
        required: true
    post:
      tags:
        - routes
      responses:
        '201':
          description: 'Reassigned route with updated backend'
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/MeshedRoute'
  '/storage/assignment/status':
    get:
      tags:
        - routes
      responses:
        '200':
          description: 'Summary of routes'
  '/storage/assignment/creation':
    post:
      tags:
        - router
      responses:
        '201':
          description: 'Create new route for pass through with load balancer.'
  '/storage/conductor':
    post:
      tags:
        - router
      responses:
        '201':
          description: 'Create new route for pass through with load balancer.'

components:
  schemas:
    MeshRouteTally:
      type: object
      description: A tally of meshed routes.
      properties:
        peers:
          type: array
          items:
            type: object
            properties:
              count:
                type: integer
              peer:
                type: string
                format: hostname
    MeshedRoute:
      type: object
      description: A route providing administrative connectivity over a mesh of managed database accounts over a pool of database clusters.
      properties:
        account:
          type: string
          format: ObjectId
        backend:
          type: string
          format: hostname
        tags:
          type: string
        created_at:
          type: string
          format: date-time
    MeshedRoutePagination:
      type: object
      description: Paginated search results for routes.
      properties:
        totalDocs:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
        page:
          type: integer
        pagingCounter:
          type: integer
        hasPrevPage:
          type: boolean
        hasNextPage:
          type: boolean
        prevPage:
          type: integer
          nullable: true
        nextPage:
          type: integer
          nullable: true
        routes:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/MeshedRoute'
       
    ServerManagedTally:
      type: object
      description: A tally of resources managed by the server.
      properties:
        account:
          description: Tally of managed user database accounts.
          type: integer
        user:
          description: Tally of managed db user credentials.
          type: integer
    AccountCreationInput:
      type: object
      description: Managed Mongo Database.
      properties:
        name:
          description: Internally unique Name/ID of this record. 8 hex characters.
          type: string
        account:
          description: Account ID used to dereference account details.
          type: string
    UserCreationInput:
      type: object
      description: Input to create DB user credentials.
      properties:
        name:
          description: Defined name.
          type: string
        internal_name:
          description: Internally unique Name record.
          type: string
        salter:
          type: string
          description: Used as filler content.

    Database:
      type: object
      description: Managed Mongo Database.
      properties:
        host:
          type: string
          description: Name of Database.
        name:
          type: string
          description: Name of Database.

    DatabaseList:
      type: object
      description: List of managed databases.
      properties:
        databases:
          type: array
          description: Array of databases.
          items:
            $ref: '#/components/schemas/Database'
        totalSize:
          description: Total size of databases.
          type: integer
          format: int64
        ok:
          type: integer
          format: int64
          description: Mongo status response.
    SiteCreationInput:
      type: object
      description: Managed site consuming a database.
      properties:
        internal_name:
          description: Internally unique Name record.
          type: string
        salter:
          type: string
          description: Some random input associated with record.
        name:
          description: Defined name.
          type: string
        api_secret:
          description: API Secret for this site.
          type: string
        uploader_prefix:
          description: Prefix to use for uploaders.
          type: string
    UserPagination:
      type: object
      properties:
        totalDocs:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
        page:
          type: integer
        pagingCounter:
          type: integer
        hasPrevPage:
          type: boolean
        hasNextPage:
          type: boolean
        prevPage:
          type: integer
          nullable: true
        nextPage:
          type: integer
          nullable: true
        users:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/User'

    User:
      type: object
      description: Managed database user credential representing access to a managed tenant database.
      properties:
        _id:
          type: string
          format: ObjectId
        account:
          type: object
          properties:
            salter:
              type: string
            id:
              type: object
              $ref: '#/components/schemas/Account'
        created_at:
          type: string
          format: date-time
        sitename:
          type: string
        tags:
          type: string
        creds:
          type: object
          properties:
            user:
              type: string
              description: Encrypted.
              format: password
            pass:
              type: string
              description: Encrypted.
              format: password
     
    Account:
      type: object
      description: Managed account representing a managed tenant database.
      properties:
        _id:
          type: string
          description: ObjectId
        account:
          type: string
          description: ObjectId
        db:
          type: object
          $ref: '#/components/schemas/Database'
    Site:
      type: object
      description: Managed site consuming a database.
      properties:
        id:
          type: integer
          format: int64
          description: Site ID. AKA WEB_NAME.


  links: {}
  callbacks: {}
security: []
