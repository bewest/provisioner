openapi: 3.0.2
servers:
  - url: 'http://p0.internal.diabetes.watch'
info:
  description: >-
    Manage hosted databases and associated sites.
    You can learn more abou [provisioner](https://github.com/bewest/provisioner)
  version: 0.0.1
  title: Provisioner DB API
  termsOfService: 'http://swagger.io/terms/'
  contact:
    email: bewest@gmail.com
  license:
    name: BSD 3
tags:
  - name: account
    description: Environment for a process.
  - name: cluster
    description: Manages processes by cluster.
  - name: db
    description: Environment for a process.
  - name: env
    description: Environment for a process.
  - name: proc
    description: Access to proc managed by cluster.
  - name: site
    description: Environment for a process.
  - name: user
    description: Environment for a process.
paths:
  '/dbs':
    get:
      tags:
        - db
        - provisioner
      operationId: get_db_list
      summary: Get list of managed dbs.
      description: JSON description of all currently managed dbs.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseList'
        '400':
          description: Invalid status value
  '/dbs/{name}':
    get:
      tags:
        - db
        - provisioner
      operationId: get_named_db
      summary: Running database by name.
      description: Returns details of a database by `name`.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
        '400':
          description: Invalid ID supplied
        '404':
          description: Database not found
      deprecated: true
      parameters:
        - in: path
          description: "Name of managed database."
          required: true
          name: name
          schema:
            type: string
  '/about/stats':
    get:
      tags:
        - about
        - provisioner
        - search
      summary: Get tally of managed storage resources, accounts (dbs) and users (credentials).
      operationId: get_server_storage_tally
      description: >-
        Returns tally of all managed storage accounts and users.  This
        generally maps to the number of databases managed and user credentials
        provisioned for those databases.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/ServerManagedTally'
  '/about/search':
    get:
      tags:
        - about
        - provisioner
        - search
      summary: Search for users using tags
      operationId: get_searchable_props
      description: >-
        Searches user table by aggregate by tags and other properties.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPagination'
  '/accounts':
    get:
      tags:
        - account
      summary: Get list of accounts.
      operationId: get_accounts_list
      description: >-
        Returns description of all db accounts.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  $ref: '#/components/schemas/Account'
    post:
      tags:
        - account
        - provisioner
      summary: Create new managed database account.
      operationId: create_new_db_with_account
      description: >-
        Returns description of all db accounts.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreationInput'
        description: Environment to run defined process.
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
  '/accounts/{account}':
    get:
      tags:
        - account
      summary: Get accounts by account identifier.
      operationId: get_named_account
      description: >-
         Get one db accounts.
      parameters:
        - in: path
          name: account
          required: true
          description: "Account name"
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
    delete:
      tags:
        - account
      summary: Delete accounts by account identifier.
      description: >-
         Delete one db account.
      operationId: delete_named_account
      parameters:
        - in: path
          name: account
          description: "Account name"
          required: true
          schema:
            type: string
      responses:
        '204':
          description: successful operation
  '/accounts/{account}/dbs':
    parameters:
      - in: path
        name: account
        description: "Account name"
        required: true
        schema:
          type: string
    get:
      tags:
        - account
      summary: Get all dbs for accounts by account identifier.
      operationId: get_dbs_for_account
      description: >-
         Get all dbs associated with account.
      responses:
        '200':
          description: successful operation
  '/accounts/{account}/users':
    parameters:
      - in: path
        description: "Account ID. Must be valid mongo objectID"
        name: account
        required: true
        schema:
          type: string
    get:
      tags:
        - account
        - user
      summary: Get list of managed db users for associated account.
      operationId: get_users_for_account
      description: >-
         Get list of managed db users for associated account.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: integer
                    default: 1
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
    post:
      tags:
        - account
        - user
      summary: Create a new managed db users for associated account.
      operationId: create_user_for_account
      description: >-
         Create a new managed db user for associated account.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreationInput'
        description: Input to create credemtials for a DB.
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  '/accounts/{account}/users/{user}':
    parameters:
      - in: path
        description: "Account ID. Must be valid mongo objectID"
        name: account
        schema:
          type: string
        required: true
      - in: path
        description: "User ID. Must be valid mongo objectID"
        name: user
        schema:
          type: string
        required: true
    get:
      tags:
        - account
        - user
      summary: Get managed db user by id for associated account.
      operationId: get_user_for_account_by_id
      description: >-
         Get managed db user by id for associated account.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/User'

    delete:
      tags:
        - account
        - user
      summary: Delete managed db user by id for associated account.
      description: >-
         Delete managed db user by id for associated account.
      operationId: delete_user_for_account_by_id
      responses:
        '200':
          description: successful operation
    post:
      tags:
        - account
        - user
      summary: Update a managed db user by id for associated account.
      operationId: update_user_for_account_by_id
      description: >-
         Update a managed db user by id for associated account.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreationInput'
        description: Input to create credemtials for a DB.
        required: true
      responses:
        '200':
          description: successful operation
        '201':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/User'
  '/accounts/{account}/sites':
    parameters:
      - in: path
        description: "Account ID. Must be valid mongo objectID"
        name: account
        required: true
        schema:
          type: string
    get:
      tags:
        - account
        - site
      summary: Get list of managed sites for associated account.
      operationId: get_sites_for_account
      description: >-
         Get list of managed sites for associated account. Each site represents
         a Nightscout deployment with its own database credentials and collection prefixes.
      responses:
        '200':
          description: successful operation
    post:
      tags:
        - account
        - site
      summary: Create a new managed site for associated account.
      operationId: create_sites_for_account
      description: >-
        Creates a new managed site with complete tenant isolation. This endpoint
        performs a multi-step workflow:
        
        1. **User Creation**: Creates a new MongoDB user with credentials scoped to the account's database
        
        2. **Configuration Generation**: Builds the site configuration including:
           - MongoDB connection string with the new user credentials
           - Unique collection prefixes for tenant data isolation (entries, settings, treatments, profile, devicestatus)
           - MQTT connection details (if configured)
           - Nightscout-specific environment variables (API_SECRET, DBSIZE_MAX, etc.)
        
        3. **Compute Forwarding**: Forwards the configuration to the node-multienv compute component
           via `POST {MULTI_ENV_API}/environs/{sitename}` to deploy the Nightscout application instance.
        
        The response includes both the provisioner's stored site record and the compute component's
        response in the `proc` field.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteCreationInput'
        description: >-
          Configuration input for the new site. The `internal_name` is used to generate
          unique collection prefixes. The `api_secret` becomes the Nightscout API_SECRET.
          The `uploader_prefix` is used for MQTT authentication.
        required: true
      responses:
        '200':
          description: >-
            Site created successfully. Response includes the user record with encrypted
            credentials and a `proc` field containing the compute component's response.
  '/accounts/{account}/sites/{site}':
    parameters:
      - in: path
        description: "Account ID. Must be valid mongo objectID"
        name: account
        schema:
          type: string
        required: true
      - in: path
        description: "Site name (sitename field of the User record associated with this site)"
        name: site
        schema:
          type: string
        required: true
    get:
      tags:
        - account
        - site
      summary: Get managed site details including compute status.
      operationId: get_site_for_account_by_site_id
      description: >-
        Retrieves the site record from the provisioner database and queries the
        node-multienv compute component for the current process status.
        
        The response includes:
        - **Site credentials**: MongoDB user and connection details (encrypted)
        - **Site configuration**: Collection prefixes and settings
        - **proc**: Live status from the compute component via `GET {MULTI_ENV_API}/environs/{sitename}`
        
        This is useful for checking if a Nightscout instance is running and its current configuration.
      responses:
        '200':
          description: Site details with compute component status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteWithProc'
    delete:
      tags:
        - account
        - site
      summary: Delete managed site and its compute resources.
      operationId: delete_site_for_account_by_site_id
      description: >-
        Deletes the site by:
        
        1. **Compute Cleanup**: Sends `DELETE {MULTI_ENV_API}/environs/{sitename}` to stop the Nightscout instance
        2. **User Record Removal**: Removes the User record from the provisioner database
        
        Note: This does NOT delete the underlying account or database - only the site-specific
        provisioner record and the compute resources. The MongoDB credentials stored in the
        admin database may need separate cleanup.
      responses:
        '204':
          description: >-
            Site deleted successfully. Note: The handler sets 204 status but the format
            middleware may still emit a body with deletion results.
    post:
      tags:
        - account
        - site
      summary: Create or update a site with a specific name.
      operationId: update_site_for_account_by_site_id
      description: >-
        Creates a new site with the specified name, or updates an existing one.
        This follows the same workflow as POST /accounts/{account}/sites but allows
        specifying the exact site name in the URL path.
        
        If a user with this sitename already exists, the old credentials are removed
        before creating new ones. The configuration is then forwarded to the compute
        component to deploy or update the Nightscout instance.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteCreationInput'
        description: >-
          Configuration for the site. See POST /accounts/{account}/sites for field descriptions.
        required: true
      responses:
        '200':
          description: Site created or updated successfully
  '/routes':
    get:
      tags:
        - routes
      responses:
        '200':
          description: An overview of routes.
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/MeshRouteTally'
  '/routes/search':
    get:
      tags:
        - routes
      responses:
        '200':
          description: Paginated search results for routes.
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/MeshedRoutePagination'
  '/routes/mesh':
    post:
      tags:
        - routes
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                account:
                  type: string
                backend:
                  type: string
                tags:
                  type: string
                  nullable: true
        description: Create a meshed route.
        required: true
      responses:
        '200':
          description: A created route.
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/MeshedRoute'
  '/routes/mesh/{account}':
    parameters:
      - in: path
        description: "Account ID. Must be valid mongo objectID"
        name: account
        schema:
          type: string
        required: true
    get:
      tags:
        - routes
      description: "Meshed route details."
      responses:
        '200':
          description: 'Route details.'
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/MeshedRoute'
    post:
      tags:
        - routes
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: string
                  nullable: true
        description: Create a meshed route.
        required: true
      responses:
        '201':
          description: 'Updated route with new tags if any.'
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/MeshedRoute'
    delete:
      tags:
        - routes
      responses:
        '204':
          description: 'Removed route'
  '/routes/mesh/{account}/reassign/{backend}':
    parameters:
      - in: path
        description: "Account ID. Must be valid mongo objectID"
        name: account
        schema:
          type: string
        required: true
      - in: path
        description: "Backend hostname:port address."
        name: backend
        schema:
          type: string
        required: true
    post:
      tags:
        - routes
      responses:
        '201':
          description: 'Reassigned route with updated backend'
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/MeshedRoute'
  '/storage/assignment/status':
    get:
      tags:
        - routes
      responses:
        '200':
          description: 'Summary of routes'
  '/storage/assignment/creation':
    post:
      tags:
        - router
      responses:
        '201':
          description: 'Create new route for pass through with load balancer.'
  '/storage/conductor':
    post:
      tags:
        - router
      responses:
        '201':
          description: 'Create new route for pass through with load balancer.'

components:
  schemas:
    MeshRouteTally:
      type: object
      description: A tally of meshed routes.
      properties:
        peers:
          type: array
          items:
            type: object
            properties:
              count:
                type: integer
              peer:
                type: string
                format: hostname
    MeshedRoute:
      type: object
      description: A route providing administrative connectivity over a mesh of managed database accounts over a pool of database clusters.
      properties:
        account:
          type: string
          format: ObjectId
        backend:
          type: string
          format: hostname
        tags:
          type: string
        created_at:
          type: string
          format: date-time
    MeshedRoutePagination:
      type: object
      description: Paginated search results for routes.
      properties:
        totalDocs:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
        page:
          type: integer
        pagingCounter:
          type: integer
        hasPrevPage:
          type: boolean
        hasNextPage:
          type: boolean
        prevPage:
          type: integer
          nullable: true
        nextPage:
          type: integer
          nullable: true
        routes:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/MeshedRoute'
       
    ServerManagedTally:
      type: object
      description: A tally of resources managed by the server.
      properties:
        account:
          description: Tally of managed user database accounts.
          type: integer
        user:
          description: Tally of managed db user credentials.
          type: integer
    AccountCreationInput:
      type: object
      description: Managed Mongo Database.
      properties:
        name:
          description: Internally unique Name/ID of this record. 8 hex characters.
          type: string
        account:
          description: Account ID used to dereference account details.
          type: string
    UserCreationInput:
      type: object
      description: Input to create DB user credentials.
      properties:
        name:
          description: Defined name.
          type: string
        internal_name:
          description: Internally unique Name record.
          type: string
        salter:
          type: string
          description: Used as filler content.

    Database:
      type: object
      description: Managed Mongo Database.
      properties:
        host:
          type: string
          description: Name of Database.
        name:
          type: string
          description: Name of Database.

    DatabaseList:
      type: object
      description: List of managed databases.
      properties:
        databases:
          type: array
          description: Array of databases.
          items:
            $ref: '#/components/schemas/Database'
        totalSize:
          description: Total size of databases.
          type: integer
          format: int64
        ok:
          type: integer
          format: int64
          description: Mongo status response.
    SiteCreationInput:
      type: object
      description: >-
        Input configuration for creating a managed Nightscout site. This data is used to:
        (1) Create MongoDB user credentials, (2) Generate unique collection prefixes for
        tenant isolation, and (3) Configure the environment that gets forwarded to the
        compute component (node-multienv).
      required:
        - internal_name
        - api_secret
      properties:
        internal_name:
          description: >-
            Internally unique identifier used to generate collection prefixes.
            The prefix pattern is: {COLLECTION_PREFIX}{internal_name}.i.{collection_name}
            This ensures each tenant's data is stored in isolated collections.
          type: string
          example: "abc123"
        salter:
          type: string
          description: >-
            Random salt value used in credential generation. Defaults to "pepper" if not provided.
            Used as part of the account association for the created user.
          default: "pepper"
        name:
          description: >-
            Human-readable name for the site. Used for display purposes and may be used
            as the sitename if no explicit sitename is provided in the URL path.
          type: string
        api_secret:
          description: >-
            The Nightscout API_SECRET for this site. This becomes the authentication
            secret for the Nightscout application instance. Should be a secure, random string.
          type: string
          format: password
        uploader_prefix:
          description: >-
            Prefix used for MQTT uploader authentication. Combined with api_secret to form
            the MQTT credentials: {uploader_prefix}:{api_secret}@{MQTT_DOMAIN}
          type: string

    SiteWithProc:
      type: object
      description: Site details including live status from the compute component.
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            proc:
              type: object
              description: >-
                Live status from the compute component via GET {MULTI_ENV_API}/environs/{sitename}.
                Contains the current process state, environment configuration, and runtime details.
              additionalProperties: true
    UserPagination:
      type: object
      properties:
        totalDocs:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
        page:
          type: integer
        pagingCounter:
          type: integer
        hasPrevPage:
          type: boolean
        hasNextPage:
          type: boolean
        prevPage:
          type: integer
          nullable: true
        nextPage:
          type: integer
          nullable: true
        users:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/User'

    User:
      type: object
      description: Managed database user credential representing access to a managed tenant database.
      properties:
        _id:
          type: string
          format: ObjectId
        account:
          type: object
          properties:
            salter:
              type: string
            id:
              type: object
              $ref: '#/components/schemas/Account'
        created_at:
          type: string
          format: date-time
        sitename:
          type: string
        tags:
          type: string
        creds:
          type: object
          properties:
            user:
              type: string
              description: Encrypted.
              format: password
            pass:
              type: string
              description: Encrypted.
              format: password
     
    Account:
      type: object
      description: Managed account representing a managed tenant database.
      properties:
        _id:
          type: string
          description: ObjectId
        account:
          type: string
          description: ObjectId
        db:
          type: object
          $ref: '#/components/schemas/Database'
    Site:
      type: object
      description: Managed site consuming a database.
      properties:
        id:
          type: integer
          format: int64
          description: Site ID. AKA WEB_NAME.


  links: {}
  callbacks: {}
security: []
